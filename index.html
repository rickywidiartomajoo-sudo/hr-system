<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>HR System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />

<!-- Google Font: Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<!-- SheetJS (Excel/CSV export) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
/* =====================================================================
   DESIGN TOKENS
===================================================================== */
:root{
  --primary:#6366F1;
  --primary-dark:#4F46E5;
  --primary-light:#EEF0FF;
  --accent:#8B5CF6;
  --success:#10B981;
  --warning:#F59E0B;
  --danger:#EF4444;
  --info:#3B82F6;

  --bg:#F5F6FB;
  --bg-elevated:#FFFFFF;
  --card:rgba(255,255,255,0.75);
  --card-solid:#FFFFFF;
  --border:rgba(15,23,42,0.08);
  --text:#111827;
  --text-muted:#6B7280;
  --text-faint:#9CA3AF;
  --sidebar-bg:rgba(255,255,255,0.65);

  --radius:16px;
  --radius-sm:10px;
  --radius-lg:22px;
  --shadow-sm:0 1px 2px rgba(15,23,42,0.04), 0 1px 1px rgba(15,23,42,0.03);
  --shadow-md:0 8px 24px -8px rgba(15,23,42,0.12), 0 2px 8px -2px rgba(15,23,42,0.06);
  --shadow-lg:0 20px 40px -12px rgba(15,23,42,0.18);
  --transition: all .18s cubic-bezier(.4,0,.2,1);
}

html.dark{
  --bg:#0B0D14;
  --bg-elevated:#12141C;
  --card:rgba(255,255,255,0.04);
  --card-solid:#161822;
  --border:rgba(255,255,255,0.08);
  --text:#E9EAF0;
  --text-muted:#9AA0B0;
  --text-faint:#6B7280;
  --sidebar-bg:rgba(18,20,28,0.75);
  --primary-light:rgba(99,102,241,0.14);
  --shadow-md:0 8px 24px -8px rgba(0,0,0,0.45), 0 2px 8px -2px rgba(0,0,0,0.3);
  --shadow-lg:0 20px 45px -12px rgba(0,0,0,0.6);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::selection{background:var(--primary);color:#fff;}

.hidden{display:none !important;}
.flex{display:flex;}
.flex-1{flex:1;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-2{gap:8px;}
.gap-3{gap:12px;}
.gap-4{gap:16px;}
.text-muted{color:var(--text-muted);}
.text-sm{font-size:13px;}
.text-xs{font-size:11px;}
.font-semibold{font-weight:600;}
.font-bold{font-weight:700;}
.w-full{width:100%;}
.mt-2{margin-top:8px;}
.mt-3{margin-top:12px;}
.mt-4{margin-top:16px;}
.mb-2{margin-bottom:8px;}
.mb-3{margin-bottom:12px;}
.mb-4{margin-bottom:16px;}

/* =====================================================================
   SCROLLBAR / SPINNER / SKELETON
===================================================================== */
.spinner{
  width:20px;height:20px;border-radius:50%;
  border:2.5px solid rgba(99,102,241,.25);
  border-top-color:var(--primary);
  animation:spin .7s linear infinite;
}
.spinner-lg{width:40px;height:40px;border-width:3.5px;}
@keyframes spin{to{transform:rotate(360deg);}}

.skeleton{
  background:linear-gradient(90deg, var(--border) 25%, rgba(148,163,184,.18) 37%, var(--border) 63%);
  background-size:400% 100%;
  animation:skeleton-loading 1.4s ease infinite;
  border-radius:8px;
}
@keyframes skeleton-loading{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* =====================================================================
   LOGIN SCREEN
===================================================================== */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 20%, rgba(99,102,241,.20), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(139,92,246,.18), transparent 45%),
    var(--bg);
}
.login-card{
  width:100%;max-width:400px;
  background:var(--card);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  padding:40px 32px;
  animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.login-logo{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:22px;margin:0 auto 18px;
  box-shadow:0 10px 24px -6px rgba(99,102,241,.55);
}
.login-title{font-size:22px;font-weight:700;text-align:center;}
.login-sub{font-size:13.5px;color:var(--text-muted);text-align:center;margin-top:6px;margin-bottom:26px;}

/* =====================================================================
   FORM ELEMENTS
===================================================================== */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text-muted);}
.input-wrap{position:relative;}
.input-wrap i.fa-fixed{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:14px;}
.input, select.input, textarea.input{
  width:100%;padding:11px 14px;
  background:var(--bg-elevated);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;color:var(--text);
  transition:var(--transition);
}
.input-wrap .input{padding-left:38px;}
.input:focus, select.input:focus, textarea.input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3.5px rgba(99,102,241,.15);
}
textarea.input{resize:vertical;min-height:80px;}
.toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:13px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:600;transition:var(--transition);
  white-space:nowrap;
}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 8px 18px -6px rgba(99,102,241,.55);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 22px -6px rgba(99,102,241,.6);}
.btn-secondary{background:var(--primary-light);color:var(--primary);}
.btn-secondary:hover{filter:brightness(0.97);}
.btn-outline{border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-ghost{color:var(--text-muted);}
.btn-ghost:hover{background:var(--border);color:var(--text);}
.btn-danger{background:rgba(239,68,68,.12);color:var(--danger);}
.btn-danger:hover{background:rgba(239,68,68,.2);}
.btn-success{background:rgba(16,185,129,.12);color:var(--success);}
.btn-success:hover{background:rgba(16,185,129,.2);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none !important;}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px;}

/* =====================================================================
   APP SHELL
===================================================================== */
#app-shell{display:flex;min-height:100vh;}

.sidebar{
  width:252px;flex-shrink:0;
  background:var(--sidebar-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:40;
  transition:transform .25s ease;
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;}
.sidebar-brand .logo-box{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;
  box-shadow:0 6px 16px -4px rgba(99,102,241,.55);
}
.sidebar-brand .brand-name{font-weight:700;font-size:15px;line-height:1.1;}
.sidebar-brand .brand-sub{font-size:10.5px;color:var(--text-muted);}

.sidebar-nav{flex:1;overflow-y:auto;padding:6px 14px;}
.nav-section-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin:16px 10px 8px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:11px;
  font-size:13.5px;font-weight:500;color:var(--text-muted);
  margin-bottom:2px;transition:var(--transition);position:relative;
}
.nav-item i{width:18px;text-align:center;font-size:14.5px;}
.nav-item:hover{background:var(--border);color:var(--text);}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 6px 16px -6px rgba(99,102,241,.6);}
.nav-item .badge-count{
  margin-left:auto;background:rgba(239,68,68,.15);color:var(--danger);
  font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;
}
.nav-item.active .badge-count{background:rgba(255,255,255,.25);color:#fff;}

.sidebar-footer{padding:14px;border-top:1px solid var(--border);}
.mini-profile{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;transition:var(--transition);}
.mini-profile:hover{background:var(--border);}
.avatar{
  width:36px;height:36px;border-radius:50%;object-fit:cover;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;
}
.mini-profile .name{font-size:12.5px;font-weight:600;line-height:1.2;}
.mini-profile .role{font-size:10.5px;color:var(--text-muted);text-transform:capitalize;}

#main-wrap{flex:1;margin-left:252px;display:flex;flex-direction:column;min-height:100vh;transition:margin .25s ease;}

.topbar{
  height:66px;flex-shrink:0;position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:14px;padding:0 24px;
  background:var(--sidebar-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.page-title{font-size:17px;font-weight:700;}
.topbar-search{
  flex:1;max-width:340px;position:relative;
}
.topbar-search input{
  width:100%;padding:9px 14px 9px 36px;border-radius:11px;
  border:1.5px solid var(--border);background:var(--bg-elevated);font-size:13px;
}
.topbar-search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:12.5px;}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);position:relative;transition:var(--transition);
}
.icon-btn:hover{background:var(--border);color:var(--text);}
.icon-btn .dot{
  position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);border:2px solid var(--bg-elevated);
}
#menu-toggle{display:none;}

.content{padding:24px;flex:1;}
@media (max-width:1023px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg);}
  #main-wrap{margin-left:0;}
  #menu-toggle{display:flex;}
  .topbar-search{display:none;}
}
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;
}
.sidebar-overlay.show{display:block;}

/* =====================================================================
   CARDS / GRID
===================================================================== */
.card{
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:20px;
}
.card-solid{background:var(--card-solid);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{position:relative;overflow:hidden;transition:var(--transition);}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.stat-icon{
  width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:17px;margin-bottom:14px;
}
.stat-value{font-size:26px;font-weight:800;line-height:1;}
.stat-label{font-size:12.5px;color:var(--text-muted);margin-top:6px;}
.stat-trend{font-size:11.5px;font-weight:600;margin-top:8px;display:inline-flex;align-items:center;gap:4px;}

/* =====================================================================
   TABLE
===================================================================== */
.table-wrap{overflow-x:auto;border-radius:var(--radius);}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
table.data-table thead th{
  text-align:left;padding:11px 14px;font-size:11px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--text-faint);font-weight:700;border-bottom:1.5px solid var(--border);white-space:nowrap;
}
table.data-table tbody td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data-table tbody tr{transition:var(--transition);}
table.data-table tbody tr:hover{background:var(--primary-light);}
table.data-table tbody tr:last-child td{border-bottom:none;}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:700;white-space:nowrap;
}
.badge-pending{background:rgba(245,158,11,.15);color:var(--warning);}
.badge-approved{background:rgba(16,185,129,.15);color:var(--success);}
.badge-rejected{background:rgba(239,68,68,.15);color:var(--danger);}
.badge-active{background:rgba(16,185,129,.15);color:var(--success);}
.badge-inactive{background:rgba(107,114,128,.15);color:var(--text-muted);}
.badge-role{background:var(--primary-light);color:var(--primary);text-transform:capitalize;}

/* =====================================================================
   MODAL / DRAWER
===================================================================== */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  background:var(--card-solid);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);border:1px solid var(--border);
  animation:modalPop .22s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalPop{from{opacity:0;transform:scale(.94) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-header{display:flex;align-items:center;justify-content:between;gap:12px;padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card-solid);border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.modal-header h3{font-size:16px;font-weight:700;flex:1;}
.modal-body{padding:22px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);}

/* =====================================================================
   TOAST
===================================================================== */
#toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;}
.toast{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:12px;min-width:280px;max-width:340px;
  background:var(--card-solid);border:1px solid var(--border);box-shadow:var(--shadow-md);
  animation:toastIn .25s cubic-bezier(.34,1.56,.64,1);font-size:13px;
}
@keyframes toastIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
.toast i{font-size:16px;}
.toast.success i{color:var(--success);}
.toast.error i{color:var(--danger);}
.toast.info i{color:var(--info);}
.toast.warning i{color:var(--warning);}

/* =====================================================================
   EMPTY STATE
===================================================================== */
.empty-state{text-align:center;padding:56px 20px;color:var(--text-muted);}
.empty-state i{font-size:38px;color:var(--text-faint);margin-bottom:14px;}
.empty-state h4{font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:4px;}
.empty-state p{font-size:12.5px;}

/* =====================================================================
   MISC
===================================================================== */
.chip-tabs{display:flex;gap:8px;flex-wrap:wrap;}
.chip-tab{padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;border:1.5px solid var(--border);color:var(--text-muted);transition:var(--transition);}
.chip-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.chip-tab:hover:not(.active){border-color:var(--primary);color:var(--primary);}

.progress-bar{height:6px;border-radius:6px;background:var(--border);overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .2s ease;}

.dropdown-menu{
  position:absolute;top:calc(100% + 8px);right:0;min-width:200px;
  background:var(--card-solid);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow-lg);padding:8px;z-index:60;
  animation:modalPop .16s ease;
}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13px;color:var(--text);transition:var(--transition);}
.dropdown-item:hover{background:var(--border);}
.dropdown-item.danger{color:var(--danger);}

.file-drop{
  border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:22px;text-align:center;
  transition:var(--transition);cursor:pointer;
}
.file-drop:hover, .file-drop.drag{border-color:var(--primary);background:var(--primary-light);}
.file-drop i{font-size:22px;color:var(--text-faint);margin-bottom:8px;}

.pagination{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:14px;}
.page-btn{width:32px;height:32px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text-muted);}
.page-btn.active{background:var(--primary);color:#fff;}
.page-btn:hover:not(.active){background:var(--border);}

.tooltip-el{position:relative;}
.avatar-lg{width:76px;height:76px;font-size:26px;}
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- ================= LOGIN SCREEN ================= -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-people-group"></i></div>
    <div class="login-title" id="login-company-name">HR System</div>
    <div class="login-sub">Masuk untuk mengelola data HR perusahaan Anda</div>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope fa-fixed"></i>
          <input type="email" class="input" id="login-email" placeholder="nama@perusahaan.com" required autocomplete="username" />
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock fa-fixed"></i>
          <input type="password" class="input" id="login-password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:38px;" />
          <button type="button" class="toggle-pass" id="toggle-login-pass"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div class="flex items-center justify-between mb-3" style="margin-top:-4px;">
        <label class="flex items-center gap-2 text-sm text-muted" style="cursor:pointer;">

/* =====================================================================
   3. UTILITIES
===================================================================== */
const Util = {
  escapeHtml(str){
    if(str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  },
  sanitizeInput(str){
    if(!str) return '';
    return String(str).trim().replace(/<script.*?>.*?<\/script>/gis, '');
  },
  formatDate(d){
    if(!d) return '-';
    const dt = new Date(d);
    return dt.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
  },
  formatDateTime(d){
    if(!d) return '-';
    const dt = new Date(d);
    return dt.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' }) + ' ' +
           dt.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
  },
  formatCurrency(n){
    if(n === null || n === undefined) return 'Rp 0';
    return 'Rp ' + Number(n).toLocaleString('id-ID');
  },
  timeAgo(d){
    const diff = (Date.now() - new Date(d).getTime()) / 1000;
    if(diff < 60) return 'Baru saja';
    if(diff < 3600) return Math.floor(diff/60) + ' menit lalu';
    if(diff < 86400) return Math.floor(diff/3600) + ' jam lalu';
    if(diff < 2592000) return Math.floor(diff/86400) + ' hari lalu';
    return Util.formatDate(d);
  },
  initials(name){
    if(!name) return '?';
    const parts = name.trim().split(/\s+/);
    return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase();
  },
  uuid(){
    return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
      const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
    });
  },
  debounce(fn, wait=300){
    let t; return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
  },
  validateEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  },
  validateFile(file, maxMB=5, allowed=['application/pdf','image/jpeg','image/jpg','image/png']){
    if(!file) return { ok:false, msg:'File tidak ditemukan' };
    if(file.size > maxMB*1024*1024) return { ok:false, msg:`Ukuran file maksimal ${maxMB}MB` };
    if(!allowed.includes(file.type)) return { ok:false, msg:'Format file tidak didukung (PDF/JPG/PNG saja)' };
    return { ok:true };
  },
  badgeStatus(status){
    return `<span class="badge badge-${status}"><i class="fa-solid fa-circle" style="font-size:6px;"></i> ${STATUS_LABEL[status]||status}</span>`;
  },
};

const Toast = {
  icons:{ success:'fa-circle-check', error:'fa-circle-xmark', info:'fa-circle-info', warning:'fa-triangle-exclamation' },
  show(type, message){
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<i class="fa-solid ${this.icons[type]}"></i><span>${Util.escapeHtml(message)}</span>`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(40px)'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, 3800);
  },
  success(msg){ this.show('success', msg); },
  error(msg){ this.show('error', msg); },
  info(msg){ this.show('info', msg); },
  warning(msg){ this.show('warning', msg); },
};

const Confirm = {
  async ask({ title='Apakah Anda yakin?', text='', icon='warning', confirmText='Ya, lanjutkan', danger=false }){
    const res = await Swal.fire({
      title, text, icon,
      showCancelButton:true,
      confirmButtonText:confirmText,
      cancelButtonText:'Batal',
      confirmButtonColor: danger ? '#EF4444' : '#6366F1',
      cancelButtonColor:'#9CA3AF',

      color: document.documentElement.classList.contains('dark') ? '#E9EAF0' : '#111827',
      customClass:{ popup:'swal-rounded' }
    });
    return res.isConfirmed;
  },
  async prompt({ title, inputLabel, inputPlaceholder='', inputType='textarea' }){
    const res = await Swal.fire({
      title, input: inputType, inputPlaceholder,

      showCancelButton:true,

===================================================================== */
const Storage = {
  async upload(bucket, file, onProgress){
    const check = Util.validateFile(file);
    if(!check.ok) throw new Error(check.msg);
    const ext = file.name.split('.').pop();
    const path = `${STATE.profile.id}/${Date.now()}_${Util.uuid().slice(0,8)}.${ext}`;
    if(onProgress) onProgress(15);
    const { data, error } = await sb.storage.from(bucket).upload(path, file, { cacheControl:'3600', upsert:false });
    if(error) throw error;
    if(onProgress) onProgress(100);
    return data.path;
  },
  async getSignedUrl(bucket, path, expiresIn=3600){
    if(!path) return null;
    const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, expiresIn);
    if(error){ console.error(error); return null; }
    return data.signedUrl;
  },
  getPublicUrl(bucket, path){
    if(!path) return null;
    const { data } = sb.storage.from(bucket).getPublicUrl(path);
    return data.publicUrl;
  },
  async remove(bucket, path){
    if(!path) return;
    await sb.storage.from(bucket).remove([path]);
  }
};

const PAGE_TITLES = {
  dashboard:'Dashboard', employees:'Data Karyawan', approval:'Approval',
  leave:'Pengajuan Cuti', reimburse:'Pengajuan Reimburse', history:'Riwayat Pengajuan',
  activity:'Log Aktivitas', profile:'Profil Saya', settings:'Pengaturan Perusahaan'
};

const Router = {
  renderSidebar(){
    const role = STATE.profile.role;
    let html = '';
    NAV_ITEMS.forEach(group => {
      const visible = group.items.filter(it => it.roles.includes(role));
      if(!visible.length) return;
      html += `<div class="nav-section-label">${group.section}</div>`;
      visible.forEach(it => {
        html += `<a href="#${it.id}" class="nav-item" data-route="${it.id}">
          <i class="${it.icon}"></i><span>${it.label}</span>
          ${it.badgeKey ? `<span class="badge-count hidden" data-badge="${it.badgeKey}">0</span>` : ''}
        </a>`;
      });
    });
    document.getElementById('sidebar-nav').innerHTML = html;
  },
  async go(route){
    const allowedRoutes = NAV_ITEMS.flatMap(g=>g.items).filter(it=>it.roles.includes(STATE.profile.role)).map(it=>it.id);
    if(!allowedRoutes.includes(route)) route = 'dashboard';
    STATE.route = route;
    location.hash = route;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.route===route));
    document.getElementById('page-title').textContent = PAGE_TITLES[route] || 'Dashboard';
    Views.renderSkeleton();
    closeSidebarMobile();
    try{
      switch(route){
        case 'dashboard': await Views.dashboard(); break;
        case 'employees': await Views.employees(); break;
        case 'approval': await Views.approval(); break;
        case 'leave': await Views.leave(); break;
        case 'reimburse': await Views.reimburse(); break;
        case 'history': await Views.history(); break;
        case 'activity': await Views.activity(); break;
        case 'profile': await Views.profile(); break;
        case 'settings': await Views.settings(); break;
      }
    }catch(e){
      console.error(e);
      Toast.error('Gagal memuat halaman: ' + e.message);
    }
    Router.refreshBadges();
  },
  async refreshBadges(){
    if(!Auth.isHrOrAdmin()) return;
    const { count:c1 } = await sb.from('leave_requests').select('id', { count:'exact', head:true }).eq('status','pending');
    const { count:c2 } = await sb.from('reimburse_requests').select('id', { count:'exact', head:true }).eq('status','pending');
    const total = (c1||0) + (c2||0);
    const badge = document.querySelector('[data-badge="pending"]');
    if(badge){
      badge.textContent = total;
      badge.classList.toggle('hidden', total===0);
    }
    document.getElementById('notif-dot').classList.toggle('hidden', total===0);
  }
};

function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

window.addEventListener('hashchange', () => {
  const route = location.hash.replace('#','') || 'dashboard';
  Router.go(route);
});

const Charts = {
  buildDayBuckets(rows, isAmount){
    const days = [];
    for(let i=29;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      days.push(d.toISOString().slice(0,10));
    }
    const map = {};
    days.forEach(d=>map[d]=0);
    rows.forEach(r=>{
      const day = (r.created_at||'').slice(0,10);
      if(day in map) map[day] += isAmount ? Number(r.amount||0) : 1;
    });
    return { labels: days.map(d=>d.slice(5)), values: days.map(d=>map[d]) };
  },
  renderTrend(canvasId, rows, color, isAmount=false){
    const ctx = document.getElementById(canvasId);
    if(!ctx) return;
    const { labels, values } = Charts.buildDayBuckets(rows, isAmount);
    if(STATE.charts[canvasId]) STATE.charts[canvasId].destroy();
    const isDark = document.documentElement.classList.contains('dark');
    STATE.charts[canvasId] = new Chart(ctx, {
      type:'line',
      data:{ labels, datasets:[{
        data: values, borderColor: color, backgroundColor: color.replace(')', ',.12)').replace('var(--','rgba(').replace('info','59,130,246').replace('accent','139,92,246'),
        tension:.4, fill:true, pointRadius:0, borderWidth:2.5,
      }]},
      options:{
        plugins:{ legend:{ display:false } },
        scales:{
          x:{ ticks:{ color: isDark?'#9AA0B0':'#6B7280', maxTicksLimit:6, font:{family:'Poppins',size:10} }, grid:{ display:false } },
          y:{ ticks:{ color: isDark?'#9AA0B0':'#6B7280', font:{family:'Poppins',size:10} }, grid:{ color: isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.05)' } }
        }
      }
    });
  }
};

  async save(id){
    const btn = document.getElementById('emp-save-btn');
    const name = Util.sanitizeInput(document.getElementById('f-name').value);

    try{
      await EmployeeAPI.resetPassword(id, pwd);
      Toast.success('Password berhasil direset');
    }catch(e){ Toast.error(e.message); }

      title:'Ubah Role', input:'select',
      inputOptions:{ employee:'Karyawan', hr:'HR', admin:'Admin' },
      inputValue: currentRole,
      showCancelButton:true, confirmButtonText:'Simpan', confirmButtonColor:'#6366F1', cancelButtonText:'Batal',

    }catch(e){ Toast.error(e.message); }

};

const ApprovalAction = {
  async approve(kind, id){
    const ok = await Confirm.ask({ title:'Setujui pengajuan ini?', icon:'question', confirmText:'Ya, setujui' });
    if(!ok) return;
    try{
      if(kind==='leave') await LeaveAPI.approve(id); else await ReimburseAPI.approve(id);
      await Log.record('approve', `${STATE.profile.full_name} menyetujui pengajuan ${kind}`);
      Toast.success('Pengajuan disetujui');
      ModalUI.close();
      Router.go(STATE.route);
    }catch(e){ Toast.error(e.message); }
  },
  async reject(kind, id){
    const reason = await Confirm.prompt({ title:'Alasan Penolakan', inputLabel:'Wajib diisi', inputPlaceholder:'Tuliskan alasan penolakan...' });
    if(!reason) return;
    try{
      if(kind==='leave') await LeaveAPI.reject(id, reason); else await ReimburseAPI.reject(id, reason);
      await Log.record('reject', `${STATE.profile.full_name} menolak pengajuan ${kind}: ${reason}`);
      Toast.success('Pengajuan ditolak');
      ModalUI.close();
      Router.go(STATE.route);
    }catch(e){ Toast.error(e.message); }
  }
};

      'Status': STATUS_LABEL[r.status],
    }));
  },
  leaveRows(){
    return (Views._leaveAll||[]).map(r => ({
      'No. Pengajuan': r.request_number,
      'Karyawan': r.profiles?.full_name || '-',
      'Jenis Cuti': LEAVE_TYPE_LABEL[r.leave_type] || r.leave_type,
      'Tanggal Mulai': Util.formatDate(r.start_date),
      'Tanggal Selesai': Util.formatDate(r.end_date),
      'Alasan': r.reason || '-',
      'Status': STATUS_LABEL[r.status],
    }));
  },
  reimburseRows(){
    return (Views._reimburseAll||[]).map(r => ({
      'No. Pengajuan': r.request_number,
      'Karyawan': r.profiles?.full_name || '-',
      'Kategori': r.category,
      'Nominal': r.amount,
      'Deskripsi': r.description || '-',
      'Tanggal': Util.formatDate(r.created_at),
      'Status': STATUS_LABEL[r.status],
    }));
  },
  excel(rows, filename='export', sheetName='Data'){
    if(!rows || !rows.length){ Toast.warning('Tidak ada data untuk diekspor'); return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, `${filename}_${Date.now()}.xlsx`);
    Log.record('export', `${STATE.profile.full_name} mengekspor data ke Excel`);
  },
  csv(rows, filename='export'){
    if(!rows || !rows.length){ Toast.warning('Tidak ada data untuk diekspor'); return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    const csv = XLSX.utils.sheet_to_csv(ws);
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `${filename}_${Date.now()}.csv`; a.click();
    Log.record('export', `${STATE.profile.full_name} mengekspor data ke CSV`);
  },
  pdf(rows, filename='export', title='Data Export'){
    if(!rows || !rows.length){ Toast.warning('Tidak ada data untuk diekspor'); return; }
    const win = window.open('', '_blank');
    const html = `
      <html><head><title>${title}</title>
      <style>
        body{font-family:Arial,sans-serif;padding:24px;}
        h2{margin-bottom:12px;}
        table{width:100%;border-collapse:collapse;font-size:12px;}
        th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
        th{background:#f3f4f6;}
      </style></head><body>
      <h2>${title} — ${new Date().toLocaleDateString('id-ID')}</h2>
      <table><thead><tr>${Object.keys(rows[0]).map(k=>`<th>${k}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${Object.values(r).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <script>window.onload = () => window.print();<\/script>
      </body></html>`;
    win.document.write(html);
    win.document.close();
    Log.record('export', `${STATE.profile.full_name} mengekspor data ke PDF`);
  }
};

const ProfileView = {
  async saveName(){
    const name = Util.sanitizeInput(document.getElementById('pf-name').value);
    if(!name){ Toast.warning('Nama tidak boleh kosong'); return; }
    try{
      await EmployeeAPI.updateOwnProfile(name);
      STATE.profile.full_name = name;
      Toast.success('Profil berhasil diperbarui');
      App.applyProfileToShell();
    }catch(e){ Toast.error(e.message); }
  },
  async changePassword(){
    const p1 = document.getElementById('pf-pass1').value;
    const p2 = document.getElementById('pf-pass2').value;
    if(p1.length < 6){ Toast.warning('Password minimal 6 karakter'); return; }
    if(p1 !== p2){ Toast.warning('Konfirmasi password tidak cocok'); return; }
    try{
      await Auth.changeOwnPassword(p1);
      Toast.success('Password berhasil diganti');
      document.getElementById('pf-pass1').value = ''; document.getElementById('pf-pass2').value = '';
    }catch(e){ Toast.error(e.message); }
  },
  async uploadAvatar(e){
    const file = e.target.files[0];
    if(!file) return;
    const check = Util.validateFile(file, 5, ['image/jpeg','image/jpg','image/png']);
    if(!check.ok){ Toast.warning(check.msg); return; }
    try{
      const path = await Storage.upload('avatar', file);
      const url = Storage.getPublicUrl('avatar', path);
      await EmployeeAPI.updateOwnProfile(undefined, url);
      STATE.profile.avatar_url = url;
      Toast.success('Foto profil berhasil diperbarui');
      App.applyProfileToShell();
      Views.profile();
    }catch(err){ Toast.error(err.message); }
  }
};

const App = {
  async init(){
    App.applyTheme();
    App.wireLoginForm();
    App.wireGlobalUI();

    const { data: { session } } = await sb.auth.getSession();
    await SettingsAPI.get().catch(()=>{});
    App.applyBranding();

    if(session){
      try{
        STATE.session = session;
        await Auth.loadProfile();
        if(STATE.profile) App.showApp();
        else App.showLogin();
      }catch(e){
        Toast.error(e.message);
        App.showLogin();
      }
    }else{
      App.showLogin();
    }

    sb.auth.onAuthStateChange((event, session) => {
      STATE.session = session;
      if(event === 'SIGNED_OUT'){ App.showLogin(); }
    });
  },

  applyBranding(){
    const s = STATE.settings;
    if(!s) return;
    document.getElementById('login-company-name').textContent = s.company_name || 'HR System';
    document.getElementById('sidebar-company-name').textContent = s.company_name || 'HR System';
    document.title = s.company_name || 'HR System';
    if(s.primary_color){
      document.documentElement.style.setProperty('--primary', s.primary_color);
    }
    if(s.logo_url){
      document.getElementById('sidebar-logo').innerHTML = `<img src="${s.logo_url}" style="width:100%;height:100%;border-radius:11px;object-fit:cover;">`;
    }
  },

  applyProfileToShell(){
    const p = STATE.profile;
    const initials = Util.initials(p.full_name);
    const avatarHtml = p.avatar_url ? `<img src="${p.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : initials;
    document.getElementById('sidebar-avatar').innerHTML = avatarHtml;
    document.getElementById('topbar-avatar').innerHTML = avatarHtml;
    document.getElementById('sidebar-user-name').textContent = p.full_name;
    document.getElementById('sidebar-user-role').textContent = ROLE_LABEL[p.role];
  },

  showLogin(){
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-shell').classList.add('hidden');
  },

  async showApp(){
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-shell').classList.remove('hidden');
    App.applyProfileToShell();
    Router.renderSidebar();
    App.wireNotifDropdown();
    App.wireProfileDropdown();
    const initialRoute = location.hash.replace('#','') || 'dashboard';
    Router.go(initialRoute);
  },

  applyTheme(){
    document.documentElement.classList.toggle('dark', STATE.theme === 'dark');
    const icon = document.querySelector('#theme-toggle i');
    if(icon) icon.className = STATE.theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  },

  wireLoginForm(){
    document.getElementById('toggle-login-pass').addEventListener('click', ()=>{
      const inp = document.getElementById('login-password');
      const icon = document.querySelector('#toggle-login-pass i');
      if(inp.type === 'password'){ inp.type='text'; icon.className='fa-solid fa-eye-slash'; }
      else { inp.type='password'; icon.className='fa-solid fa-eye'; }
    });

    document.getElementById('login-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = Util.sanitizeInput(document.getElementById('login-email').value);
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('remember-me').checked;
      if(!Util.validateEmail(email)){ Toast.warning('Format email tidak valid'); return; }

      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try{
        await Auth.login(email, password, remember);
        Toast.success('Login berhasil');
        await App.showApp();
      }catch(err){
        Toast.error(err.message === 'Invalid login credentials' ? 'Email atau password salah' : err.message);
      }finally{
        btn.disabled = false; btn.innerHTML = '<span class="btn-label">Masuk</span>';
      }
    });

    document.getElementById('forgot-password-link').addEventListener('click', async (e)=>{
      e.preventDefault();
      const { value: email } = await Swal.fire({
        title:'Lupa Password', input:'email', inputLabel:'Masukkan email akun Anda',
        inputPlaceholder:'nama@perusahaan.com', showCancelButton:true,
        confirmButtonText:'Kirim Link Reset', confirmButtonColor:'#6366F1', cancelButtonText:'Batal',
      });
      if(!email) return;
      try{
        await Auth.sendResetPassword(email);
        Toast.success('Link reset password telah dikirim ke email Anda');
      }catch(err){ Toast.error(err.message); }
    });
  },

  wireGlobalUI(){
    document.getElementById('theme-toggle').addEventListener('click', ()=>{
      STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('hr_theme', STATE.theme);
      App.applyTheme();
      // re-render charts with new theme colors if on dashboard
      if(STATE.route === 'dashboard') Router.go('dashboard');
    });

    document.getElementById('menu-toggle').addEventListener('click', ()=>{
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebar-overlay').classList.add('show');
    });
    document.getElementById('sidebar-overlay').addEventListener('click', closeSidebarMobile);

    document.getElementById('sidebar-nav').addEventListener('click', (e)=>{
      const item = e.target.closest('.nav-item');
      if(item){ e.preventDefault(); Router.go(item.dataset.route); }
    });

    document.getElementById('global-search').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        Router.go('history');
        setTimeout(()=>{
          const inp = document.getElementById('hist-search');
          if(inp){ inp.value = e.target.value; inp.dispatchEvent(new Event('input')); }
        }, 300);
      }
    });
  },

  wireNotifDropdown(){
    const btn = document.getElementById('notif-btn');
    const dd = document.getElementById('notif-dropdown');
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      document.getElementById('profile-dropdown').classList.add('hidden');
      dd.classList.toggle('hidden');
      if(!dd.classList.contains('hidden')){
        const activities = await Log.recent(6);
        dd.innerHTML = activities.length ? activities.map(a=>`
          <div class="dropdown-item" style="cursor:default;align-items:flex-start;">
            <i class="fa-solid fa-circle-info" style="margin-top:2px;color:var(--primary);"></i>
            <div>
              <div class="text-sm">${Util.escapeHtml(a.description||a.action)}</div>
              <div class="text-xs text-muted">${Util.timeAgo(a.created_at)}</div>
            </div>
          </div>`).join('') : `<div class="text-sm text-muted" style="padding:12px;">Tidak ada notifikasi baru</div>`;
      }
    });
  },

  wireProfileDropdown(){
    const btn = document.getElementById('topbar-avatar-btn');
    const dd = document.getElementById('profile-dropdown');
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      document.getElementById('notif-dropdown').classList.add('hidden');
      dd.classList.toggle('hidden');
      dd.innerHTML = `
        <div class="dropdown-item" onclick="Router.go('profile')"><i class="fa-solid fa-user"></i> Profil Saya</div>
        ${Auth.isAdmin() ? `<div class="dropdown-item" onclick="Router.go('settings')"><i class="fa-solid fa-gear"></i> Pengaturan</div>` : ''}
        <div class="dropdown-item danger" onclick="Auth.logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
      `;
    });
  },
};

App.init();
</script>
